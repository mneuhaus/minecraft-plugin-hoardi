name: HoardiDemo
version: 1.0.0
main: de.hoarder.demo.HoardiDemo
api-version: '1.21.9'
depend: [Hoardi]
description: Stages and films the Hoardi demo video (test server only)
commands:
  demo:
    description: Demo director
    usage: /demo <build|reset|cam|shot|all|free|marks>
    permission: hoardidemo.use
permissions:
  hoardidemo.use:
    default: op
